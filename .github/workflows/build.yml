name: Build EditMenuRadius
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 0.1.0
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid dpkg
      - name: Install Theos
        run: git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
      - name: Link iPhoneOS SDK
        run: mkdir -p "$HOME/theos/sdks" && ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS.sdk"
      - name: Build RootHide arm64e package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          rm -rf "$THEOS"
          cp -R "$HOME/theos" "$THEOS"
          make all FINALPACKAGE=1 ARCHS=arm64e
          find . -name 'EditMenuRadiusTweak.dylib' -exec cp {} layout/Library/MobileSubstrate/DynamicLibraries/EditMenuRadius.dylib \;
          rm -rf layout/Library/PreferenceBundles/EditMenuRadiusPrefs.bundle
          mkdir -p layout/Library/PreferenceBundles
          find . -type d -name 'EditMenuRadiusPrefs.bundle' -exec cp -R {} layout/Library/PreferenceBundles/ \;
          python3 tools/package.py
          mkdir -p verified
          cp packages/*.deb verified/EditMenuRadius_0.1.0_iphoneos-arm64e.deb
          dpkg-deb -I verified/EditMenuRadius_0.1.0_iphoneos-arm64e.deb
          dpkg-deb -c verified/EditMenuRadius_0.1.0_iphoneos-arm64e.deb | grep -E 'Library/MobileSubstrate|Library/Preference'
      - uses: actions/upload-artifact@v4
        with:
          name: edit-menu-radius-${{ inputs.version }}-arm64e
          path: packages/*.deb
          if-no-files-found: error
